AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

# TODO: paramterise the domains.
Parameters:
  ScheduleStartInstancePeriodicityParameter:
    Description: "Please specify how often the OSINT worker should run"
    Default: "rate(24 hours)"
    Type: String
  SchedulePopulateWorkQueuePeriodicityParameter:
    Description: "Please specify how often the worker should run"
    Default: "rate(4 hours)"
    Type: String
  ScheduleNmapWorkerInvocationPeriodicityParameter:
    Description: "Please specify how often the worker should run"
    Default: "rate(5 minutes)"
    Type: String
  DynamoDbRetentionPeriod:
    Description: "Please specify in seconds how long the DynamoDB table should retain its items for"
    Default: "315360000" # 10 years
    Type: Number
  ReconngWorkspaceName:
    Description: "Please specify the Workspace Name to be used"
    Default: ""
    Type: String
  DomainsToEnumerate:
    Description: "Please provide a comma-delimited list of domains to enumerate"
    Default: ""
    Type: String
  EcrRepoArn:
    Description: "Please provide the ARN of the ECR repo in which the build containers are stored"
    Type: String
  EcrRepoUri:
    Description: "Please provide the URI of the ECR repo in which the build containers are stored"
    Type: String
  ImageTag:
    Description: "Suffix for the build ECR image tags - onnmap-<value> and reconng-<value>. The pipeline sets this to the git SHA so each build repoints; a manual deploy can use 'latest'."
    Type: String
    Default: "latest"
  VpcId:
    Description: "VPC the recon-ng Fargate task's security group lives in (the default VPC)."
    Type: AWS::EC2::VPC::Id
  VpcSubnetIds:
    Description: "Subnets the recon-ng Fargate task runs in (default-VPC public subnets)."
    Type: List<AWS::EC2::Subnet::Id>

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups: 
      -
        Label:
          default: "recon-ng configuration"
        Parameters:
          - ReconngWorkspaceName
          - DomainsToEnumerate

Resources:
  # ------------------------------------------------------------------
  # recon-ng Fargate worker. Replaced the EC2 WorkerInstance + the
  # startEc2Instance boot Lambda (removed in #44); ReconngSchedule below
  # replaced their EventBridge schedule.
  # ------------------------------------------------------------------
  ReconngCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  ReconngLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  ReconngSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: recon-ng Fargate task - egress only (no ingress).
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: HTTPS (OSINT APIs, ECR, S3, AWS APIs)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP (some OSINT sources)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: DNS over TCP (resolve module)
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: DNS over UDP
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0

  ReconngTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ReconngTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: reconngTaskRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${ResultsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt ResultsBucket.Arn

  ReconngTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-reconng"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ReconngTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ReconngTaskRole.Arn
      ContainerDefinitions:
        - Name: reconng
          Image: !Join ['', [!Ref EcrRepoUri, ':reconng-', !Ref ImageTag]]
          Essential: true
          Environment:
            - Name: PSCAN_DOMAINS_TO_ENUMERATE
              Value: !Ref DomainsToEnumerate
            - Name: PSCAN_RECONNG_WORKSPACE
              Value: !Ref ReconngWorkspaceName
            - Name: PSCAN_S3_BUCKET
              Value: !Ref ResultsBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ReconngLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: reconng

  # Role EventBridge Scheduler assumes to run the task.
  ReconngScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: reconngScheduleRunTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${AWS::StackName}-reconng:*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt ReconngCluster.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ReconngTaskRole.Arn
                  - !GetAtt ReconngTaskExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  # Reuses ScheduleStartInstancePeriodicityParameter (rate(2 hours) devtest
  # / rate(24 hours) prod) - the parameter that used to drive startEc2Instance.
  ReconngSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: !Ref ScheduleStartInstancePeriodicityParameter
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt ReconngCluster.Arn
        RoleArn: !GetAtt ReconngScheduleRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref ReconngTaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              Subnets: !Ref VpcSubnetIds
              SecurityGroups:
                - !Ref ReconngSecurityGroup
              AssignPublicIp: ENABLED

  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # results.csv is a transient hand-off - onArrivalOfResults parses it and
          # deletes it within seconds, and the data is persisted in ResultsTableHosts.
          # These rules only ever act on objects orphaned by a failed parse.
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-transient-result-csvs
            Status: Enabled
            ExpirationInDays: 7

  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub "${ResultsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  NmapWorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      # TODO: message retention should probably match the perioidicity of the quueue-populating lambda.
      MessageRetentionPeriod: 604800 # 7 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NmapWorkQueueDLQ.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 300 # >= the onNmap function timeout (120s), so a message stays hidden until the worker finishes.

  NmapWorkQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days

  ResultsTableHosts:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      AttributeDefinitions:
        -
          AttributeName: "datetime"
          AttributeType: "S"
        -
          AttributeName: "host"
          AttributeType: "S"
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - 
          IndexName: host-datetime-index # I have to trick it in order to overcome recent deletion, hence "2"
          KeySchema:
            -
              AttributeName: "host"
              KeyType: "HASH"
            -
              AttributeName: "datetime"
              KeyType: "RANGE"
          Projection:
            ProjectionType: ALL
      KeySchema:
        -
          AttributeName: "datetime"
          KeyType: "HASH"
        -
          AttributeName: "host"
          KeyType: "RANGE"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true

  DerivedTableHostsOfInterest:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      AttributeDefinitions:
        -
          AttributeName: "host"
          AttributeType: "S"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        -
          AttributeName: "host"
          KeyType: "HASH"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true

  ResultsTableHostPorts:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        -
          AttributeName: "datetime"
          AttributeType: "S"
        -
          AttributeName: "composite_HostIpUdpTcp"
          AttributeType: "S"
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - 
          IndexName: hostports-datetime-index # I have to trick it in order to overcome recent deletion, hence "2"
          KeySchema:
            -
              AttributeName: "composite_HostIpUdpTcp"
              KeyType: "HASH"
            -
              AttributeName: "datetime"
              KeyType: "RANGE"
          Projection:
            ProjectionType: ALL
      KeySchema:
        -
          AttributeName: "datetime"
          KeyType: "HASH"
        -
          AttributeName: "composite_HostIpUdpTcp"
          KeyType: "RANGE"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true

  DerivedTableHostPortsOfInterest:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        -
          AttributeName: "composite_HostIpUdpTcp"
          AttributeType: "S"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        -
          AttributeName: "composite_HostIpUdpTcp"
          KeyType: "HASH"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true

  onArrivalOfHostsStreamEvent:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: 'The function that updates the Hosts of Interest table.'
      Environment:
        Variables:
          TABLE_NAME_HOSTS_OF_INTEREST:
            Ref: DerivedTableHostsOfInterest
      Events:
        DyDbEvent:
          Type: DynamoDB
          Properties:
            StartingPosition: LATEST
            Stream:
              !GetAtt ResultsTableHosts.StreamArn
      Handler: onArrivalOfHostsStreamEvent.handler
      MemorySize: 256
      Role: !GetAtt onPopulateHostsOfInterestTableExecutionRole.Arn
      Runtime: python3.13
      Timeout: 20

  onArrivalOfHostPortsStreamEvent:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: 'The function that updates the HostPorts of Interest table.'
      Environment:
        Variables:
          TABLE_NAME_HOSTPORTS_OF_INTEREST:
            Ref: DerivedTableHostPortsOfInterest
      Events:
        DyDbEvent2:
          Type: DynamoDB
          Properties:
            StartingPosition: LATEST
            Stream:
              !GetAtt ResultsTableHostPorts.StreamArn
      Handler: onArrivalOfHostPortsStreamEvent.handler
      MemorySize: 256
      Role: !GetAtt onPopulateHostPortsOfInterestTableExecutionRole.Arn
      Runtime: python3.13
      Timeout: 20

  onArrivalOfResults:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: 'The function that parses the results, uploads them.'
      Environment:
        Variables:
          DYNAMODB_TTL_OFFSET:
            Ref: DynamoDbRetentionPeriod
          TABLE_NAME: 
            Ref: ResultsTableHosts
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket:
              Ref: ResultsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: "csv"
      Handler: onArrivalOfResults.handler
      MemorySize: 256
      Role: !GetAtt onArrivalOfResultsExecutionRole.Arn
      Runtime: python3.13
      Timeout: 20

  onNmap:
    Type: AWS::Serverless::Function
    Properties:
      Description: 'The nmap worker function.'
      Environment:
        Variables:
          WORK_QUEUE:
            Ref: NmapWorkQueue
          HOST_PORTS_TABLE:
            Ref: ResultsTableHostPorts
          HOSTS_OF_INTEREST_TABLE:
            Ref: DerivedTableHostsOfInterest
      ImageUri: !Join ['', [!Ref EcrRepoUri, ':onnmap-', !Ref ImageTag]]
      PackageType: Image
      Role: !GetAtt onNmapExecutionRole.Arn
      Timeout: 120

  onNmapEventRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: !Ref ScheduleNmapWorkerInvocationPeriodicityParameter
      State: ENABLED
      Targets:
        - Arn: !GetAtt onNmap.Arn
          Id: onNmapFunction

  onNmapEventRuleLambdaPermission: 
    Type: AWS::Lambda::Permission
    Properties: 
      FunctionName: !Ref onNmap
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt onNmapEventRule.Arn


  onPopulateHostsOfInterestTable:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: 'The function that constructs the Hosts of Interest Table.'
      Environment:
        Variables:
          DYNAMODB_TTL_OFFSET:
            Ref: DynamoDbRetentionPeriod
          TABLE_NAME_RESULTS:
            Ref: ResultsTableHosts
          TABLE_NAME_HOSTS_OF_INTEREST:
            Ref: DerivedTableHostsOfInterest
      Handler: onPopulateHostsOfInterestTable.handler
      MemorySize: 1024
      Role: !GetAtt onPopulateHostsOfInterestTableExecutionRole.Arn
      Runtime: python3.13
      Timeout: 60

  onPopulateNmapWorkQueue:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: 'The function that populates the Nmap work queue.'
      Environment:
        Variables:
          TABLE_TO_SCAN:
            Ref: DerivedTableHostsOfInterest
          QUEUE_TO_POPULATE:
            Ref: NmapWorkQueue
          RULE_TRIGGER_WORKER_LAMBDA:
            Ref: onNmapEventRule
      Events:
        QueuePopulationScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref SchedulePopulateWorkQueuePeriodicityParameter
      Handler: onPopulateNmapWorkQueue.handler
      MemorySize: 1024
      Role: !GetAtt onPopulateNmapWorkQueueExecutionRole.Arn
      Runtime: python3.13
      Timeout: 60

  onArrivalOfResultsExecutionRole:
    Type: "AWS::IAM::Role"
    Properties: 
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - 
            Effect: "Allow"
            Principal: 
              Service: 
                - "lambda.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole" # Important. Gives Lambda perms to write to CWatch.
      Path: "/"

  onArrivalOfResultsExecutionRolePolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: policyForOnArrivalOfResultsExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: 'dynamodb:PutItem'
            Resource: !GetAtt ResultsTableHosts.Arn
          - Effect: Allow
            Action: 
              - 's3:DeleteObject'
              - 's3:GetObject'
            Resource: !Join
              - ''
              - - !GetAtt ResultsBucket.Arn
                - /*
      Roles:
        - !Ref onArrivalOfResultsExecutionRole

  onNmapExecutionRole:
    Type: "AWS::IAM::Role"
    Properties: 
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - 
            Effect: "Allow"
            Principal: 
              Service: 
                - "lambda.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole" # Important. Gives Lambda perms to write to CWatch.
      Path: "/"

  onNmapExecutionRolePolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: policyForOnPopulateHostsOfInterestTableExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - 'ecr:*' # TODO: tighten, for least priv.
            Resource: !Ref EcrRepoArn
          - Effect: Allow
            Action:
              - 'sqs:DeleteMessage'
              - 'sqs:ReceiveMessage'
              - 'sqs:GetQueueAttributes'
            Resource: !GetAtt NmapWorkQueue.Arn
          - Effect: Allow
            Action:
              - 'dynamodb:PutItem'
              - 'dynamodb:UpdateItem'
            Resource: 
              - !GetAtt DerivedTableHostsOfInterest.Arn
              - !GetAtt ResultsTableHostPorts.Arn
          - Effect: Allow
            Action:
              - 'events:DisableRule'
            Resource: 
              - !GetAtt onNmapEventRule.Arn
      Roles:
        - !Ref onNmapExecutionRole

  onPopulateNmapWorkQueueExecutionRole:
    Type: "AWS::IAM::Role"
    Properties: 
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - 
            Effect: "Allow"
            Principal: 
              Service: 
                - "lambda.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole" # Important. Gives Lambda perms to write to CWatch.
      Path: "/"

  onPopulateNmapWorkQueueExecutionRolePolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: policyForonPopulateNmapWorkQueueExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # TODO: Allow read from table.
          # TODO: Allow write to queue.

          # TODO: Delete this b/s.
          - Effect: Allow
            Action:
              - 'dynamodb:DescribeStream'
              - 'dynamodb:GetRecords'
              - 'dynamodb:GetShardIterator'
              - 'dynamodb:ListStreams'
              - 'dynamodb:Query'
              - 'dynamodb:Scan'
              - 'dynamodb:UpdateItem'
            Resource: 
              - !GetAtt DerivedTableHostsOfInterest.Arn
          - Effect: Allow
            Action: 
              - 'sqs:SendMessage'
            Resource: !GetAtt NmapWorkQueue.Arn
          - Effect: Allow
            Action:
              - 'events:EnableRule'
            Resource: 
              - !GetAtt onNmapEventRule.Arn
      Roles:
        - !Ref onPopulateNmapWorkQueueExecutionRole

  onPopulateHostsOfInterestTableExecutionRole:
    Type: "AWS::IAM::Role"
    Properties: 
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - 
            Effect: "Allow"
            Principal: 
              Service: 
                - "lambda.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole" # Important. Gives Lambda perms to write to CWatch.
      Path: "/"

  onPopulateHostsOfInterestTableExecutionRolePolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: policyForOnPopulateHostsOfInterestTableExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - 'dynamodb:DescribeStream'
              - 'dynamodb:GetRecords'
              - 'dynamodb:GetShardIterator'
              - 'dynamodb:ListStreams'
              - 'dynamodb:Query'
              - 'dynamodb:Scan'
            Resource: 
              - !GetAtt DerivedTableHostsOfInterest.Arn
              - !GetAtt ResultsTableHosts.Arn
              - !Join
                - ''
                - - !GetAtt ResultsTableHosts.Arn
                  - '/index/*'
              - !Join
                - ''
                - - !GetAtt ResultsTableHosts.Arn
                  - '/stream/*'
          - Effect: Allow
            Action: 
              - 'dynamodb:PutItem'
              - 'dynamodb:UpdateItem'
            Resource: !GetAtt DerivedTableHostsOfInterest.Arn
      Roles:
        - !Ref onPopulateHostsOfInterestTableExecutionRole

  onPopulateHostPortsOfInterestTableExecutionRole:
    Type: "AWS::IAM::Role"
    Properties: 
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - 
            Effect: "Allow"
            Principal: 
              Service: 
                - "lambda.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole" # Important. Gives Lambda perms to write to CWatch.
      Path: "/"

  onPopulateHostPortsOfInterestTableExecutionRolePolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: policyForOnPopulateHostPortsOfInterestTableExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - 'dynamodb:DescribeStream'
              - 'dynamodb:GetRecords'
              - 'dynamodb:GetShardIterator'
              - 'dynamodb:ListStreams'
              - 'dynamodb:Query'
              - 'dynamodb:Scan'
            Resource: 
              - !GetAtt DerivedTableHostPortsOfInterest.Arn
              - !GetAtt ResultsTableHostPorts.Arn
              - !Join
                - ''
                - - !GetAtt ResultsTableHostPorts.Arn
                  - '/index/*'
              - !Join
                - ''
                - - !GetAtt ResultsTableHostPorts.Arn
                  - '/stream/*'
          - Effect: Allow
            Action: 
              - 'dynamodb:PutItem'
              - 'dynamodb:UpdateItem'
            Resource: !GetAtt DerivedTableHostPortsOfInterest.Arn
      Roles:
        - !Ref onPopulateHostPortsOfInterestTableExecutionRole


