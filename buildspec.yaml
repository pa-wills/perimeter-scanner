# Build stage for the perimeter-scanner pipeline.
#
# 1. Build + push the two container images to the pipeline ECR repo:
#      onnmap-<sha> / onnmap-latest   (the onNmap Lambda image)
#      reconng-<sha> / reconng-latest (the recon-ng Fargate task image)
#    The <sha> tag is exported as IMAGE_TAG so the deploy stages can pin
#    onNmap's ImageUri to this exact build (see pipeline.yaml).
# 2. sam build + sam package the rest of template.yaml.

version: 0.2

env:
  exported-variables:
    - IMAGE_TAG

phases:
  install:
    runtime-versions:
      python: 3.13
  build:
    commands:
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}"
      - REGISTRY="${ECR_REPO_URI%%/*}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      # onNmap - container-image Lambda
      - docker build -t "$ECR_REPO_URI:onnmap-$IMAGE_TAG" -t "$ECR_REPO_URI:onnmap-latest" onNmap
      - docker push "$ECR_REPO_URI:onnmap-$IMAGE_TAG"
      - docker push "$ECR_REPO_URI:onnmap-latest"

      # reconng - ECS Fargate task image
      - docker build -t "$ECR_REPO_URI:reconng-$IMAGE_TAG" -t "$ECR_REPO_URI:reconng-latest" reconng
      - docker push "$ECR_REPO_URI:reconng-$IMAGE_TAG"
      - docker push "$ECR_REPO_URI:reconng-latest"

      # Package the SAM template (zip function code -> S3). onNmap's ImageUri is
      # a CFN intrinsic referencing the ImageTag parameter, which sam passes
      # through for the deploy stage to resolve.
      - sam build
      - sam package --template-file template.yaml --s3-bucket "$S3_BUCKET" --output-template-file packaged-template.yaml --force-upload --image-repository "$ECR_REPO_URI"

artifacts:
  files:
    - packaged-template.yaml
    - template.yaml
