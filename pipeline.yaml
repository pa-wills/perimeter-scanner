AWSTemplateFormatVersion: 2010-09-09
Description: This stack represents the pipeline for my perimeter scanner.

# Assumptions
#
# 1. Existing connection to Github through CodeStar for the source. 
# 2. Personal Access Token stored in the Param Store.
# 3. Role deployed in the target Accounts, for CFN to assume.
# 4. An Account for this CICD workload to deploy to.
# 5. Accounts for the DevTest and Production workloads to deploy to, from this pipeline.

# Params are then entered directly into the GUI at stack-create/update time.
Parameters:
  CodeStarSourceConnectionArn:
    Type: String
    Description: "The ARN of the Codestar Connection for Github."
    Default: "arn:aws:codestar-connections:ap-southeast-2:623056247312:connection/e23152ba-62a3-4321-93a5-314cf6858b87"
  DevTestCfnRoleArn:
    Type: String
    Description: "The Role that will be assumed by CloudFormation in order to deploy DevTest resources. Created by the perimeter-scanner-cross-account-roles StackSet (crossAccountRoles.yaml)."
    Default: "arn:aws:iam::494507141278:role/perimeter-scanner-cf-execution-role-devtest"
  DevTestCodePipelineRoleArn:
    Type: String
    Description: "The Role that will be assumed by the CodePipeline in order to execute the DevTest stage. Created by the perimeter-scanner-cross-account-roles StackSet (crossAccountRoles.yaml)."
    Default: "arn:aws:iam::494507141278:role/perimeter-scanner-cross-account-role-devtest"
  GitHubFullRepoID:
    Type: String
    Description: "The GitHub repo's name."
    Default: "pa-wills/perimeter-scanner"
  GitHubRepoBranch:
    Type: String
    Description: "The GitHub repo's branch the pipeline's source stage tracks."
    Default: "modernise-and-harden"
  ProductionCfnRoleArn:
    Type: String
    Description: "The Role that will be assumed by CloudFormation in order to deploy production resources. Created by the perimeter-scanner-cross-account-roles StackSet (crossAccountRoles.yaml)."
    Default: "arn:aws:iam::732786819153:role/perimeter-scanner-cf-execution-role-prod"
  ProductionCodePipelineRoleArn:
    Type: String
    Description: "The Role that will be assumed by the CodePipeline in order to execute the Production stage. Created by the perimeter-scanner-cross-account-roles StackSet (crossAccountRoles.yaml)."
    Default: "arn:aws:iam::732786819153:role/perimeter-scanner-cross-account-role-prod"
  ReconngWorkspaceName:
    Description: "Please specify the Workspace Name to be used"
    Default: ""
    Type: String
  DomainsToEnumerate:
    Description: "Please provide a comma-delimited list of domains to enumerate"
    Default: ""
    Type: String
  PipelineEncryptionKey:
    Type: String
    Description: "The ARN of the KMS key to be used to encrypt CodePipeline artifacts."
    Default: "arn:aws:kms:ap-southeast-2:623056247312:key/7f51caf1-758f-4fa2-9618-06dba104faa7" # alias/CodePipelineArtifactEncryptionKey-norotate; the previous key (40255820) was scheduled for deletion.
  DevTestAccountId:
    Type: String
    Description: "DevTest workload account ID - allowed to pull images from the build ECR repo."
    Default: "494507141278"
    AllowedPattern: '\d{12}'
  ProductionAccountId:
    Type: String
    Description: "Production workload account ID - allowed to pull images from the build ECR repo."
    Default: "732786819153"
    AllowedPattern: '\d{12}'

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups: 
      - 
        Label: 
          default: "Application Settings"
        Parameters: 
          - ReconngWorkspaceName
          - DomainsToEnumerate
      - 
        Label: 
          default: "Source Stage"
        Parameters:
          - CodeStarSourceConnectionArn
          - GitHubFullRepoID
          - GitHubRepoBranch
          - PipelineEncryptionKey
      - 
        Label: 
          default: "DevTest Stage"
        Parameters: 
          - DevTestCodePipelineRoleArn
          - DevTestCfnRoleArn
      - 
        Label: 
          default: "Production Stage"
        Parameters: 
          - ProductionCodePipelineRoleArn
          - ProductionCfnRoleArn

Resources:
  # What's here?
  # A pipeline, and separate CodeBuild project.
  # S3 bucket for the artifacts, KMS key for SSE-KMS, ECR for the built container (for one of the lambdas).
  # Custom Resource for the purposes of cleaning out the bucket on deletion.
  # Roles for CodePipeline and for CodeBuild. And obviously associated Policies.

  ProjectPipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn: [CodePipelineServiceRole]
    Description: The pipeline. Kind of the core of things, really.
    Properties:
      ArtifactStore:
        EncryptionKey:
          Id: !Ref PipelineEncryptionKey
          Type: KMS 
        Location: !Ref PipelineOutputBucket
        Type: S3
      DisableInboundStageTransitions:
        -
          Reason: "Disable auto-transition as a protective measure."
          StageName: "Production"
      RoleArn: !GetAtt
        - CodePipelineServiceRole
        - Arn
      Stages:
      - Name: Source
        Actions:
        # https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CodestarConnectionSource.html
        - Name: source
          InputArtifacts: []
          ActionTypeId:
            Version: "1"
            Category: Source
            Owner: AWS
            Provider: CodeStarSourceConnection
          OutputArtifacts:
          - Name: "SourceArtifact"
          Configuration:
            ConnectionArn: !Ref CodeStarSourceConnectionArn
            FullRepositoryId: !Ref GitHubFullRepoID
            BranchName: !Ref GitHubRepoBranch
            OutputArtifactFormat: "CODE_ZIP"
          RunOrder: 1
      - Name: Build
        Actions:
        - Name: build
          Namespace: BuildVars   # exposes IMAGE_TAG (git sha) from buildspec.yaml env.exported-variables
          InputArtifacts:
          - Name: "SourceArtifact"
          ActionTypeId:
            Category: Build
            Owner: AWS
            Version: "1"
            Provider: CodeBuild
          OutputArtifacts:
          - Name: "BuildArtifact"
          Configuration:
            ProjectName: !Ref CodeBuildProject
          RunOrder: 1
      - Name: DevTest
        Actions:
        - Name: devtest-create-update-stack
          InputArtifacts:
          - Name: "BuildArtifact"
          ActionTypeId:
            Category: Deploy
            Owner: AWS
            Version: "1"
            Provider: CloudFormation
          OutputArtifacts: []
          Configuration:
            ActionMode: CREATE_UPDATE # Difficulty separating into two steps, hence CREATE_UPDATE
            StackName: PerimeterScanner-DevTest # Unfortunately this has to be set statically. Portability?
            Capabilities: CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND
            ChangeSetName: pipeline-changeset-devtest
            ParameterOverrides: !Sub '{"ReconngWorkspaceName": "${ReconngWorkspaceName}", "DomainsToEnumerate": "${DomainsToEnumerate}", "ScheduleStartInstancePeriodicityParameter": "rate(2 hours)", "DynamoDbRetentionPeriod": "86400", "EcrRepoArn": "${PipelineOutputRegistry.Arn}", "EcrRepoUri": "${PipelineOutputRegistry.RepositoryUri}", "ImageTag": "#{BuildVars.IMAGE_TAG}", "VpcId": "vpc-0e8f962fd09269d3c", "VpcSubnetIds": "subnet-09903165111f1b00a,subnet-0498bf9ae7b1cacc1,subnet-0819c79d9e9ebbd75"}'
            RoleArn: !Ref DevTestCfnRoleArn
            TemplatePath: "BuildArtifact::packaged-template.yaml"
          RoleArn: !Ref DevTestCodePipelineRoleArn
          RunOrder: 1
      - Name: Production
        Actions:
        - Name: production-create-update-stack
          InputArtifacts:
          - Name: "BuildArtifact"
          ActionTypeId:
            Category: Deploy
            Owner: AWS
            Version: "1"
            Provider: CloudFormation
          OutputArtifacts: []
          Configuration:
            ActionMode: CREATE_UPDATE # Difficulty separating into two steps, hence CREATE_UPDATE
            StackName: PerimeterScanner-Prod # Unfortunately this has to be set statically. Portability?
            Capabilities: CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND
            ChangeSetName: pipeline-changeset-prod
            ParameterOverrides: !Sub '{"ReconngWorkspaceName": "${ReconngWorkspaceName}", "DomainsToEnumerate": "${DomainsToEnumerate}", "ScheduleStartInstancePeriodicityParameter": "rate(24 hours)", "DynamoDbRetentionPeriod": "315360000", "EcrRepoArn": "${PipelineOutputRegistry.Arn}", "EcrRepoUri": "${PipelineOutputRegistry.RepositoryUri}", "ImageTag": "#{BuildVars.IMAGE_TAG}", "VpcId": "vpc-08accd2152bd2e9f6", "VpcSubnetIds": "subnet-0ace992d97adf6b86,subnet-02632e13b50ffe205,subnet-06732be4cf6bcc20e"}'
            RoleArn: !Ref ProductionCfnRoleArn
            TemplatePath: "BuildArtifact::packaged-template.yaml"
          RoleArn: !Ref ProductionCodePipelineRoleArn
          RunOrder: 1

  CodeBuildProject:
    DependsOn: [PipelineOutputBucket]
    Description: This is the build sub-stage.
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: ECR_REPO_NAME
            Value: !Ref PipelineOutputRegistry
          - Name: ECR_REPO_URI
            Value: !GetAtt PipelineOutputRegistry.RepositoryUri
          - Name: S3_BUCKET
            Value: !Ref PipelineOutputBucket
        Image: "aws/codebuild/amazonlinux-x86_64-standard:5.0" # Amazon Linux 2023; provides Python 3.13 + a current Docker.
        PrivilegedMode: true # This has to be set, because we're making docker containers.
        Type: LINUX_CONTAINER
      ServiceRole: !GetAtt
        - CodeBuildTrustRole
        - Arn
      Source:
        BuildSpec: "buildspec.yaml"
        Type: CODEPIPELINE
      TimeoutInMinutes: 5

  PipelineOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: GlacierRule
            Status: Enabled
            ExpirationInDays: 90
            Transitions:
              - TransitionInDays: 30
                StorageClass: GLACIER
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # TODO: need a lifecycle policy to keep the last 5 images, say.
  PipelineOutputRegistry:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCodeBuildToPush
            Effect: Allow
            Principal:
              AWS: !GetAtt CodeBuildTrustRole.Arn
            Action:
              - "ecr:GetDownloadUrlForLayer"
              - "ecr:BatchGetImage"
              - "ecr:BatchCheckLayerAvailability"
              - "ecr:PutImage"
              - "ecr:InitiateLayerUpload"
              - "ecr:UploadLayerPart"
              - "ecr:CompleteLayerUpload"
          # onNmap (container Lambda in DevTest/Prod) is pulled by the Lambda service.
          - Sid: LambdaECRImageCrossAccountRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
          # DevTest/Prod roles (e.g. the Phase 2 Fargate task execution role) pulling
          # images cross-account; still gated by those roles' own IAM policies.
          - Sid: AllowCrossAccountPull
            Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${DevTestAccountId}:root"
                - !Sub "arn:aws:iam::${ProductionAccountId}:root"
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability

  # https://stackoverflow.com/questions/48362572/aws-codepipeline-error-cross-account-pass-role-is-not-allowed
  # This bucket needs to be accessible from the destination accounts.
  PipelineOutputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:  
      Bucket: !Ref PipelineOutputBucket
      PolicyDocument:
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${PipelineOutputBucket}"
              - !Sub "arn:aws:s3:::${PipelineOutputBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false
          - Effect: Allow
            Action: ["s3:*"]
            Resource:
              - !Sub "arn:aws:s3:::${PipelineOutputBucket}"
              - !Sub "arn:aws:s3:::${PipelineOutputBucket}/*"
            Principal:
              AWS:
                - !GetAtt CodePipelineServiceRole.Arn
          - Effect: Allow
            Action: ["s3:Get*"]
            Resource:
              - !Sub "arn:aws:s3:::${PipelineOutputBucket}"
              - !Sub "arn:aws:s3:::${PipelineOutputBucket}/*"
            Principal:
              AWS:
                - !Ref DevTestCfnRoleArn
                - !Ref ProductionCfnRoleArn
                - !Ref DevTestCodePipelineRoleArn
                - !Ref ProductionCodePipelineRoleArn

  # Copying someone else's example of the common bucket cleaning scenario, for Lambda custom resources.
  # https://github.com/mike-mosher/custom-resource-s3-bucket-delete/blob/master/custom-resource.yml
  CustomResourceLambdaFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      Code:
        ZipFile: |
          import cfnresponse
          import boto3
            
          def handler(event, context):
            print(event)
            print('boto version ' + boto3.__version__)
                        
            # Globals
            responseData = {}
            ResponseStatus = cfnresponse.SUCCESS
            s3bucketName = event['ResourceProperties']['s3bucketName']
            if event['RequestType'] == 'Create':
              responseData['Message'] = "Resource creation successful!"
              
            elif event['RequestType'] == 'Update':
              responseData['Message'] = "Resource update successful!"
              
            elif event['RequestType'] == 'Delete':
              # Need to empty the S3 bucket before it is deleted
              s3 = boto3.resource('s3')
              bucket = s3.Bucket(s3bucketName)
              bucket.objects.all().delete()
              responseData['Message'] = "Resource deletion successful!"
            cfnresponse.send(event, context, ResponseStatus, responseData)
            
      Handler: index.handler
      Runtime: python3.13
      Role: !GetAtt CustomResourceLambdaExecutionRole.Arn

  CustomResourceLambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: LoggingPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: S3Policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:List*
                  - s3:DeleteObject
                Resource: '*'

  CustomResource:
    Type: Custom::CustomResource
    Properties:
      ServiceToken: !GetAtt CustomResourceLambdaFunction.Arn
      s3bucketName: !Ref PipelineOutputBucket
    DependsOn: PipelineOutputBucket

  # </copy>

  CodeBuildTrustRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: [codebuild.amazonaws.com]
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: CodeBuildRolePolicy # TODO: Use intrinsic function
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: ["*"]
              - Effect: Allow
                Action:
                  - 'cloudformation:*'
                  - 'ecr:*'
                  - 'events:*'
                  - 'iam:*'
                  - 's3:*'
                Resource: '*'
              # Read/write SSE-KMS artifacts in the pipeline bucket. Needed
              # explicitly now that the artifact key's policy delegates to
              # IAM (Principal: account root) instead of granting Principal: "*".
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:Encrypt'
                  - 'kms:ReEncrypt*'
                  - 'kms:GenerateDataKey*'
                  - 'kms:DescribeKey'
                Resource: !Ref PipelineEncryptionKey

  CodePipelineServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: CodePipelineRolePolicy # TODO: Use intrinsic function
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'codebuild:BatchGetBuilds'
                  - 'codebuild:StartBuild'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'codestar-connections:UseConnection'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                  - 'lambda:ListFunctions'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'sts:AssumeRole'
                Resource:
                  - !Ref ProductionCodePipelineRoleArn
                  - !Ref DevTestCodePipelineRoleArn
              - Effect: Allow
                Action:
                  - 's3:*'
                  - 'cloudformation:*'
                Resource: '*'
              # Encrypt/decrypt SSE-KMS artifacts in the pipeline bucket
              # (artifact key policy now delegates to IAM rather than Principal: "*").
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:Encrypt'
                  - 'kms:ReEncrypt*'
                  - 'kms:GenerateDataKey*'
                  - 'kms:DescribeKey'
                Resource: !Ref PipelineEncryptionKey

  # CloudFormation service role for THIS stack (PerimeterScanner-App), so it
  # has an associated service role rather than running as the deploying
  # principal (Security Hub CloudFormation.4). Same self-bootstrap pattern as
  # pwdotcom's PwDotCom-Website/PipelineCfExecutionRole:
  #   - the first deploy that introduces this resource runs ad hoc (no
  #     --role-arn: the role doesn't exist yet);
  #   - every deploy after passes
  #       --role-arn arn:aws:iam::<cicd-acct>:role/perimeter-scanner-pipeline-cf-execution-role
  # Scoped by service (the pipeline/build/custom-resource roles have no fixed
  # RoleName, so their ARNs aren't knowable ahead of the first deploy); adds
  # ecr:* for PipelineOutputRegistry, which the pwdotcom site pipeline lacks.
  PipelineCfExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: perimeter-scanner-pipeline-cf-execution-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: PipelineStackExecutionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'cloudformation:*'
                  - 'codebuild:*'
                  - 'codepipeline:*'
                  - 'ecr:*'
                  - 'iam:*'
                  - 'lambda:*'
                  - 's3:*'
                Resource: '*'
              # This stack has a stack-level notification ARN
              # (arn:aws:sns:...:CloudformationStackEvents); once deploys run as
              # this role instead of the caller, they need sns:Publish to it or
              # every operation fails at the first event.
              - Effect: Allow
                Action:
                  - 'sns:Publish'
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*'
              # Updating the ProjectPipeline resource calls UpdatePipeline, which
              # validates the CodeStarSourceConnection source action - that needs
              # PassConnection on the connection. (codeconnections:* is the
              # renamed service; grant both namespaces.)
              - Effect: Allow
                Action:
                  - 'codestar-connections:PassConnection'
                  - 'codestar-connections:UseConnection'
                  - 'codeconnections:PassConnection'
                  - 'codeconnections:UseConnection'
                Resource: !Ref CodeStarSourceConnectionArn